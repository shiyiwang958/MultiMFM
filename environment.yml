# MultiMFM environment (micromamba or conda/mamba).
# Covers BOTH experiment families: QM9/GEOM molecules (tabasco, multimfm) and
# DNA cyclizability (dmfm).
#
#   micromamba env create -f environment.yml
#   micromamba activate multimfm
#
# The pip torch==2.5.1 wheel bundles the CUDA 12.4 runtime; scripts/env.sh adds
# those bundled libraries to LD_LIBRARY_PATH. Pinned to the versions this project
# was developed and verified against.
name: multimfm

channels:
  - conda-forge

dependencies:
  - python=3.11
  - numpy=1.26.*
  - pandas=2.0.*
  - pyyaml=6.*
  - scipy
  - tqdm
  - rdkit=2024.09.4
  - conda-forge::openbabel=3.1.1
  - pip>=23
  - pip:
      - -e .
      - "setuptools<81"   # torchmetrics 0.11.x imports pkg_resources
      - torch==2.5.1
      - tensordict==0.6.2
      - lightning==2.*
      - torchmetrics==0.11.4
      - einops==0.8.*
      - datasets==4.8.*
      - huggingface-hub==1.*
      - posebusters==0.3.1
      - datamol==0.12.*
      - posecheck==1.3.1
      - hydra-core==1.3.*
      - rich>=15
      - rootutils
      - biotite==1.*
      - lmdb==1.*
      - wandb==0.19.6
      # DNA (dmfm) experiments
      - pytorch-lightning==2.6.*
      - scikit-learn==1.9.*
      - biopython==1.88
      # notebooks and figures
      - matplotlib==3.10.*
      - seaborn==0.13.*
      - ipykernel==7.*
      # tests (pytest tests/dna, tests/qm9)
      - pytest==8.*
